<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Mon classement des Chicago Bulls</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <h1>Mon classement des Chicago Bulls</h1>
    <p>Clique sur un joueur pour le sélectionner.</p>

    <section id="galerie">
        <div class="carte" id="Jordan">
            <h3>Michael Jordan</h3>
            <p>Numéro 23</p>
        </div>

        <div class="carte" id="Rose">
            <h3>Derrick Rose</h3>
            <p>Numéro 1</p>
        </div>

        <div class="carte" id="Pippen">
            <h3>Scottie Pippen</h3>
            <p>Numéro 33</p>
        </div>
    </section>

    <p id="selection">Aucun joueur sélectionné</p>

    <div id="zone-couleur">
        <h2>Classement</h2>
    </div>

    <div id="panneau">
        <p id="compteur">Joueurs présents : 0</p>
        <div id="conteneur"></div>
    </div>

</body>

</html>
